name: Dump Secret Config
on: workflow_dispatch  # 手动触发

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Write secret to file
        run: |
          echo "${{ secrets.BACKEND_TOML }}" > config-file.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovered-config
          path: config-file.txt
